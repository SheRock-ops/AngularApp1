
<div class="user-card">

    <!-- PROFILE PICTURE -->
    <div class="profile-avatar">
        @if (profileImage) {
            <img [src]="profileImage" alt="Profile Picture">
        } @else {
            <span>SD</span>
        }
    </div>

    <!-- PROFILE PICTURE UPLOAD -->
    <div class="profile-upload">
        <label for="profilePicture">Change Profile Picture</label>

        <input
            type="file"
            id="profilePicture"
            accept="image/*"
            (change)="uploadProfilePicture($event)"
        >

        @if (profileImage) {
            <button type="button" (click)="removeProfilePicture()">
                Remove Picture
            </button>
        }
    </div>

    <!-- USER PROFILE -->
    <h2>My Profile</h2>

    <!-- ONLINE/OFFLINE STATUS FROM PARENT COMPONENT -->
    <p class="profile-status">
        <span [class.online]="isOnline"
              [class.offline]="!isOnline">
            ● {{ isOnline ? 'Online' : 'Offline' }}
        </span>
    </p>

    @if (!isEditing) {

        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Role:</strong> {{ role }}</p>
        <p><strong>Email:</strong> {{ email }}</p>

        <button type="button" (click)="editProfile()">
            Edit Profile
        </button>

    } @else {

        <form (ngSubmit)="saveProfile()">

            <p>
                <label for="name">Name:</label>
                <input
                    id="name"
                    type="text"
                    name="name"
                    [(ngModel)]="editName"
                    required>
            </p>

            <p>
                <label for="role">Role:</label>
                <input
                    id="role"
                    type="text"
                    name="role"
                    [(ngModel)]="editRole"
                    required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="editEmail"
                    required>
            </p>

            <button type="submit">
                Save Profile
            </button>

            <button type="button" (click)="cancelEdit()">
                Cancel
            </button>

        </form>

    }

</div>
